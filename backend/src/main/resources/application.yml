spring:
  profiles.default: dev
  application.name: rooms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rooms}
    username: ${DB_USER:${USER:postgres}}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
server.port: 8080
rooms:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:rooms@rooms.local}
  seed: ${ROOMS_SEED:false}
  cookie-secure: ${COOKIE_SECURE:false}
springdoc.swagger-ui.path: /swagger-ui.html
management.endpoints.web.exposure.include: health
